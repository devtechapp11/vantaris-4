# Supabase CLI settings for this project (used by `npx supabase functions deploy`).
project_id = "uoxxbefprjbczhdrjuiv"

# All three functions check the caller themselves:
#  - billing and tutor verify the player's session with Supabase Auth,
#  - razorpay-webhook verifies Razorpay's HMAC signature.
# The platform JWT gate is off so it works with both legacy and new API keys
# and so Razorpay (which has no Supabase session) can reach the webhook.
[functions.billing]
verify_jwt = false

[functions.razorpay-webhook]
verify_jwt = false

[functions.tutor]
verify_jwt = false

# Deal cases: both check the player's session themselves (see _shared/http.ts).
[functions.generate-exercise]
verify_jwt = false

[functions.submit-answer]
verify_jwt = false

# V4 onboarding: guest desks (anonymous sign-ins), turned into accounts with
# linkIdentity / updateUser (manual linking). Only these two Auth properties are
# declared; config push leaves every undeclared remote property unchanged.
[auth]
enable_anonymous_sign_ins = true
enable_manual_linking = true
